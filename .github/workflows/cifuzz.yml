name: CIFuzz

on:
  pull_request:
    branches: [ master ]

permissions: {}

jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Build Fuzzers
      id: build
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
      with:
        oss-fuzz-project-name: 'unbound'
        language: c
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
      with:
        oss-fuzz-project-name: 'unbound'
        language: c
        fuzz-seconds: 300
    - name: Upload Crash
      uses: actions/upload-artifact@v4
      if: failure() && steps.build.outcome == 'success'
      with:
        name: artifacts
        path: ./out/artifacts
