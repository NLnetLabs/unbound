server:
	verbosity: 8
	# num-threads: 1
	interface: 127.0.0.1
	port: @PORT@
	proxy-protocol-port: @PORT@
	allow-proxy: 33.44.55.0/24
	allow-proxy: 127.0.0.0/8
	allow-proxy: ::1/128
	use-syslog: no
	access-control: 1.2.3.0/24 allow
	directory: ""
	pidfile: "unbound.pid"
	chroot: ""
	username: ""
	do-not-query-localhost: no
	local-zone: "example.com" static
	local-data: "www.example.com. 3600 IN A 10.20.30.40"
forward-zone:
	name: "."
	forward-addr: "127.0.0.1@12345"

