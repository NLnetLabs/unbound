server:
	verbosity: 8
	# num-threads: 1
	interface: 127.0.0.1
	port: @PORT@
	use-syslog: no
	directory: ""
	pidfile: "unbound.pid"
	module-config: "respip validator iterator"
	chroot: ""
	username: ""
	do-not-query-localhost: no
	auth-task-threads: 1
	log-queries: yes
	log-replies: yes

forward-zone:
	name: "."
	forward-addr: "127.0.0.1@@TOPORT@"

rpz:
	name: "rpz.example.com"
	zonefile: "auth_load_write.zone"
	for-downstream: yes
	master: "127.0.0.1@@TOPORT@"
	rpz-log: yes
	rpz-log-name: "rpz.example.com"
